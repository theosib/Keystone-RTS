# Builds Keystone's Windows installer and zip. release.yml calls this for a tag, and puts them on
# the release with the rest. Run by hand from the Actions tab to try a build: that leaves the files
# as the run's artifacts.
name: Windows release

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: dev
      pins:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: Version to call the build
        default: dev

permissions:
  contents: read

env:
  VULKAN_SDK_VERSION: 1.4.363.0

jobs:
  windows:
    runs-on: windows-2025
    steps:
      # Side by side under exactly these names: docs/PLATFORMS.md
      - uses: actions/checkout@v4
        with: { path: Keystone }
      - shell: bash
        env:
          PINS: ${{ inputs.pins }}
        run: Keystone/tools/package/clone.sh

      - name: Cache the Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install the Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkansdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe" -OutFile $installer
          & $installer --root "C:\VulkanSDK\$env:VULKAN_SDK_VERSION" --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK install failed: $LASTEXITCODE" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        shell: pwsh
        env:
          VULKAN_SDK: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
        run: Keystone\tools\windows\build.ps1 -Root $env:GITHUB_WORKSPACE -BuildDir fv-release -Gui -NoTests

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}' -replace '^v', ''
          Keystone\tools\windows\package.ps1 -Root $env:GITHUB_WORKSPACE -BuildDir fv-release -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: keystone-windows
          path: |
            dist/*.exe
            dist/*.zip
